[project]
name = "up4ds-backend"
version = "0.1.0"
description = "Child Health Screening Across the 4Ds: Lambda backend"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "boto3>=1.44.9",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "mangum>=0.22.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "moto[dynamodb,server]>=5.2.5",
    "ruff>=0.17.6",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
